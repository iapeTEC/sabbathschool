<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="ea_nlx_icon.ico" type="image/x-icon">
    <title>Salas dos Alunos</title>
    <style>
        :root {
            --bg: #0b1220;
            --text: #ffffff;
            --muted: #cbd5e1;
            --gap: 2.5vmin;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            color: var(--text);
            background: var(--bg);
        }

        /* Telão: tudo cabe em uma tela, sem rolagem */
        .tela {
            display: grid;
            grid-template-rows: auto 1fr;
            gap: var(--gap);
            height: 100vh;
            padding: var(--gap);
        }

        .topo {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--gap);
        }

        .topo h1 {
            font-size: 6vmin;
            font-weight: 800;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .qr {
            display: flex;
            align-items: center;
            gap: 1.5vmin;
            color: var(--muted);
            font-size: 2.2vmin;
            font-weight: 700;
            text-align: right;
        }

        .qr img {
            width: 11vmin;
            height: 11vmin;
            padding: 0.8vmin;
            background: #ffffff;
            border-radius: 1.2vmin;
        }

        .cartoes {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--gap);
            min-height: 0;
        }

        .cartao {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 4vmin;
            padding: 4vmin;
            border-radius: 3vmin;
            text-align: center;
            border: 0.6vmin solid rgba(255,255,255,0.35);
        }

        .turma {
            font-size: min(8vmin, 4.2vw);
            font-weight: 800;
            line-height: 1.05;
            text-transform: uppercase;
        }

        .seta {
            font-size: 7vmin;
            line-height: 1;
        }

        .sala {
            padding: 2.5vmin 5vmin;
            border-radius: 2vmin;
            background: #ffffff;
            font-size: min(11vmin, 5.5vw);
            font-weight: 900;
            line-height: 1.05;
        }

        .azul {
            background: #1d4ed8;
        }

        .azul .sala {
            color: #1e3a8a;
        }

        .verde {
            background: #15803d;
        }

        .verde .sala {
            color: #14532d;
        }

        /* Celular: cartões um embaixo do outro */
        @media (max-width: 768px) {
            .tela {
                height: auto;
                min-height: 100vh;
                padding: 16px;
                gap: 16px;
            }

            .topo h1 {
                font-size: 1.8rem;
            }

            .qr {
                display: none;
            }

            .cartoes {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .cartao {
                gap: 16px;
                padding: 28px 16px;
                border-radius: 20px;
            }

            .turma {
                font-size: 2.2rem;
            }

            .seta {
                font-size: 2rem;
            }

            .sala {
                font-size: 2.8rem;
                padding: 12px 24px;
                border-radius: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="tela">
        <header class="topo">
            <h1>Salas dos Alunos</h1>
            <div class="qr">
                <span>Abra no<br>celular</span>
                <img src="qr-code-placeholder.png" alt="QR Code para abrir o mapa de salas no celular">
            </div>
        </header>

        <main class="cartoes">
            <section class="cartao azul">
                <div class="turma">Adolescentes<br>e Jovens</div>
                <div class="seta">&#8595;</div>
                <div class="sala">6º Ano</div>
            </section>

            <section class="cartao verde">
                <div class="turma">Adultos<br>e Seniors</div>
                <div class="seta">&#8595;</div>
                <div class="sala">Auditório Central</div>
            </section>
        </main>
    </div>
</body>
</html>
